# Native mode — YummyGraph tools only, no grep enrichment
#
# Explicit tools: yummygraph-query, yummygraph-context, yummygraph-impact, yummygraph-cypher
# Available as fast bash commands (~100ms via eval-server)
#
# Use this mode to isolate the value of explicit tools without grep augmentation.
agent:
  agent_class: 'eval.agents.yummygraph_agent.YummyGraphAgent'
  yummygraph_mode: 'native'
  step_limit: 30
  cost_limit: 3.0
  track_yummygraph_usage: true

environment:
  environment_class: 'eval.environments.yummygraph_docker.YummyGraphDockerEnvironment'
  enable_yummygraph: true
  skip_embeddings: true
  yummygraph_timeout: 120
  eval_server_port: 4848
